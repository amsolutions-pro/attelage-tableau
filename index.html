<script>
const P=JSON.parse(document.getElementById("p").textContent),K="tableau-mdp";
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dechiffrer(mdp){
const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(mdp),"PBKDF2",false,["deriveKey"]);
const cle=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.sel),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},cle,b(P.data)));}
function ecrire(h){document.open();document.write(h);document.close();}
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();const m=document.getElementById("m").value,er=document.getElementById("e");er.textContent="";
let h;try{h=await dechiffrer(m);}catch(x){er.textContent="Mot de passe incorrect.";return;}
if(document.getElementById("s").checked)localStorage.setItem(K,m);ecrire(h);};
const memo=localStorage.getItem(K);if(memo){dechiffrer(memo).then(ecrire).catch(()=>localStorage.removeItem(K));}
</script></body></html>
